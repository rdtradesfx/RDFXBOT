name: RDFX ADMIN

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      message:
        description: "What to run (scheduled = send whatever is due right now)"
        type: choice
        default: scheduled
        options:
          - scheduled
          - preview
          - asia
          - london
          - newyork
          - overlap
          - news
          - calendar
          - alert
          - funnel_mentorship
          - funnel_vip
          - social
      dry_run:
        description: "Dry run: print only, send nothing (tick OFF to really send)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: rdfx-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check config and message files
        run: PYTHONPATH=src python -m rdfx_bot check || echo "::warning::Config check found problems. See the log above."

      - name: Run the bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_MESSAGE: ${{ inputs.message }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          export PYTHONPATH=src
          mode="${INPUT_MESSAGE:-scheduled}"
          dry=()
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then dry=(--dry-run); fi
          case "$mode" in
            scheduled) python -m rdfx_bot run "${dry[@]}" ;;
            preview)   python -m rdfx_bot preview ;;
            asia|london|newyork|overlap|news|calendar|alert|funnel_mentorship|funnel_vip|social)
                       python -m rdfx_bot send "$mode" "${dry[@]}" ;;
            *) echo "Unknown option: $mode"; exit 2 ;;
          esac

      - name: Save state (what has been sent)
        if: ${{ !cancelled() }}
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then echo "Dry run: nothing to save."; exit 0; fi
          git config user.name "rdfx-bot"
          git config user.email "rdfx-bot@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then echo "No state changes."; exit 0; fi
          git commit -m "chore(state): update bot state [skip ci]"
          for attempt in 1 2 3 4; do
            if git push; then exit 0; fi
            git pull --rebase -X theirs || git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo "::error::Could not save the state file. Check branch protection rules."
          exit 1
