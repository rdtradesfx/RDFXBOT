name: Keep bot schedule alive

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable the bot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable bot.yml --repo "$GITHUB_REPOSITORY"
