name: Setup
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          python3 bootstrap.py
          git config user.name rdfx-bot
          git config user.email rdfx-bot@users.noreply.github.com
          git add -A
          git commit -m "Install RDFX bot files"
          git push
