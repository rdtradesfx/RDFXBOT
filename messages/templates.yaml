# RDFX bot: templates for the messages built from live data.
# {curly_words} are filled in by the bot. Keep them exactly as written.
#
# BOLD: put **two stars** either side of the words. Example: **this is bold**
# (Do not use <b> tags: if one is not closed properly the whole message breaks.)
#
# Careful with spacing: every line inside a "|" block must start with the SAME number of spaces.

# ---------------------------------------------------------------- daily news
news:
  body: |
    **🚨RDFX | DAILY MARKET NEWS 🚨**

    **WHAT'S MOVING THE MARKETS? 🌎**

    Good morning, team.
    Here's your latest market news briefing:

    {sections}

    **Keep an eye on today's major economic releases and potential volatility.**

  # Used when there is no headline and no event for any market.
  none_body: |
    **🚨RDFX | DAILY MARKET NEWS 🚨**

    **WHAT'S MOVING THE MARKETS? 🌎**

    Good morning, team.
    Nothing major on gold or the main pairs overnight, stay patient.

    **Keep an eye on today's major economic releases and potential volatility.**

  # The bold title above each market. A market with no headline shows its events for the day instead.
  section_titles:
    gold: "**• 🥇 GOLD**"
    usd: "**• 🇺🇸 USD**"
    eur: "**• 🇪🇺 EUR**"
    gbp: "**• 🇬🇧 GBP**"
    aud: "**• 🇦🇺 AUD**"

  # One headline: text and source name only, no link.
  headline_item: '{title} ({source})'
  # What goes between two headlines in the same section.
  headline_join: "\n"

# ------------------------------------------------------- economic calendar
calendar:
  header: |
    **📅 RDFX | ECONOMIC CALENDAR**
    **🚨 Today's Important News Events 🗞️🚨**

  # One line per event. The time is bold. (F = forecast, P = previous)
  event_block: "{impact} **{time}** {flag} {title} · F {forecast} · P {previous}"
  event_join: "\n"

  footer: "**Remember: news events can increase spreads, volatility and slippage.**"

  # Used instead of the event list when there is nothing red or orange today.
  empty_body: "**No red or orange news events scheduled today.** Lower volatility expected, stay patient and trade your plan."

  # Shown when the feed has no forecast/previous figure.
  empty_value: "—"

# ------------------------------------------------------------ news alerts
# {minutes_text} is "15 minutes" when on time, or the real time left if GitHub ran late.
alert:
  single: |
    **⏰ RDFX | NEWS ALERT ⏰**

    **{impact} {flag} {title}**
    Releasing in **{minutes_text}** ({time} UK time)

    Forecast: {forecast} · Previous: {previous}

    **News events can increase spreads, volatility and slippage.**

  # Used only when several events release in the same minute.
  group: |
    **⏰ RDFX | NEWS ALERT ⏰**

    Releasing in **{minutes_text}** ({time} UK time)

    {events}

    **News events can increase spreads, volatility and slippage.**

  group_event: |
    **{impact} {flag} {title}**
    Forecast: {forecast} · Previous: {previous}
